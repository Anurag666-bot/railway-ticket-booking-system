<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Railway Management System</title>
  <style>
    :root {
      --primary-color: hsla(60, 100%, 25%, 0.855);
      --secondary-color: red;
      --tertiary-color: blue;
      --background-image: url(Nepal_Railway.jpg);
    }

    body {
      background-image: var(--background-image);
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    header {
      margin-bottom: 20px;
    }

    .box-container {
      text-align: center;
    }

    .box {
      padding: 20px;
      border-radius: 10px;
      background-color: rgba(255, 255, 255, 0.8);
      margin-bottom: 20px;
      transition: transform 0.3s ease;
      display: inline-block;
    }

    .box:hover {
      transform: scale(1.05);
    }

    a {
      color: var(--primary-color);
      text-decoration: none;
    }

    a:hover {
      color: var(--secondary-color);
    }

    a:active {
      color: var(--tertiary-color);
    }

    h1 {
      color: var(--secondary-color);
      text-align: center;
      font-size: 3rem;
      margin-bottom: 2rem;
    }

    h2 {
      font-style: italic;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Railway Management System</h1>
  </header>
  <nav class="box-container">
    <div class="box">
      <h2>New User</h2>
      <a href="http://localhost/railway/new_user_form.html">Register</a>
    </div>
    <div class="box">
      <h2>Enquiry and Ticket Booking</h2>
      <a href="http://localhost/railway/enquiry.php">Enquire or Book Tickets</a>
    </div>
    <div class="box">
      <h2>Ticket History OR Cancellation</h2>
      <a href="http://localhost/railway/user_login.htm">View History or Cancel Tickets</a>
    </div>
    <div class="box">
      <h2>Admin Login</h2>
      <a href="http://localhost/railway/admin_login.php">Login as Admin</a>
    </div>
  </nav>
  <footer>
  </footer>
</body>
</html>
